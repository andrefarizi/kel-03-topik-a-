version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app_server
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/server.crt:/etc/ssl/certs/server.crt
      - ./nginx/server.key:/etc/ssl/private/server.key
    networks:
      - frontend
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: db_server
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tubes_keamanan}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rahasia_root}
      MYSQL_USER: ${DB_USERNAME:-kel03user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rahasia}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prahasia_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true 

volumes:
  db_data: